<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ELIZA Chatbot</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="crt-screen">
        <div class="terminal-container">
            <div class="chat-area" id="chatArea">
                <div class="message system">[ELIZA] 14:03:15</div>
                <div class="message reply">WHY DO YOU SAY YOU FEEL AFRAID OF THE TECHNOLOGY SURROUNDING YOU?</div>
                
                <div class="message user">[USER] 14:04:01</div>
                <div class="message text">IT FEELS TOO HUMAN, YET NOT HUMAN AT ALL.</div>

                <div class="message system">[ELIZA] 14:04:05</div>
                <div class="message reply">IS IT IMPORTANT TO YOU THAT IT FEELS HUMAN?</div>
            </div>

            <div class="input-area">
                <span class="prompt-symbol">></span>
                <input type="text" id="userInput" class="terminal-input" placeholder="TYPE YOUR RESPONSE..." autofocus autocomplete="off">
            </div>

            <div class="button-area">
                <button class="btn btn-burn" onclick="clearChat()">BURN RECORDS</button>
                <button class="btn btn-transmit" onclick="sendMessage()">TRANSMIT</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
